# AmmoLedger — nginx configuration for the production frontend container
#
# Topology: nginx serves the built SPA (dist/) and proxies /api → backend.
# TLS is terminated upstream (Traefik or another edge proxy); nginx speaks
# plain HTTP on port 5173.  Do NOT add HSTS or force-HTTPS redirects here —
# that belongs at the edge and would produce contradictory headers.
#
# nginx listens on 5173 — the same port the previous Vite dev-server image
# used — so the container port is unchanged and any upstream Traefik router
# keeps working without reconfiguration.
#
# The backend upstream is configured at container start via the AL_BACKEND_URL
# environment variable (default: http://backend:8000).  See docker-compose.yml.
# The backend has no published ports — it is only reachable over the internal
# Docker bridge network; this nginx is the sole ingress point.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # X-Content-Type-Options prevents MIME-sniffing attacks.
    add_header X-Content-Type-Options "nosniff" always;

    # Content-Security-Policy for the built SPA:
    #   default-src 'self'        — block everything not listed below by default
    #   script-src  'self' 'unsafe-inline'
    #                             — 'unsafe-inline' needed for the inline theme
    #                               script in index.html (sets dark/light class
    #                               before paint to avoid flash); no eval needed
    #   style-src   'self' 'unsafe-inline'
    #                             — Tailwind injects inline styles at runtime
    #   img-src     'self' data: blob: https:
    #                             — 'self' for served assets and /api/* images;
    #                               blob: for local image crop preview;
    #                               https: for Brave image-search thumbnails
    #                               displayed in FindImageDialog (optional feature)
    #   connect-src 'self'        — all API calls go through /api (same origin)
    #   font-src    'self'        — no external fonts (all bundled)
    #   frame-ancestors 'none'   — prevents clickjacking (replaces X-Frame-Options)
    #   form-action 'self'        — form submissions stay on-origin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # Referrer-Policy: send origin only on same-origin requests; omit entirely
    # for cross-origin navigations (prevents leaking paths to third parties).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: opt out of browser features the app does not use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # Mirror the Vite dev-server proxy: strip /api prefix and forward to the
    # backend container over the internal Docker network.  The backend is
    # private (no published ports) — this is the only path to reach it.
    location /api/ {
        proxy_pass ${AL_BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Increase timeouts for long-running operations (backup, CSV import).
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Pass WebSocket upgrades if the backend ever needs them.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # React Router uses the HTML5 History API — serve index.html for all
    # non-asset paths so client-side routes work on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite content-hashes all JS/CSS filenames; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers (add_header is not inherited into
        # nested location blocks that have their own add_header directives).
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Favicon and other root-level static files get short cache.
    location ~* \.(png|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# Needed for the WebSocket upgrade header passthrough.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
