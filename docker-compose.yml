# AmmoLedger — production compose
#
# This stack publishes the frontend on host port 5173 and runs the backend
# on a private bridge network (`ammoledger_net`) with no published ports.
# For external / internet access put a reverse proxy (Nginx Proxy Manager,
# Traefik, Caddy, Cloudflare Tunnel, etc.) in front of the frontend — see
# docs/INSTALL.md for topology and PRD §12.
#
# To attach the frontend to an externally-managed reverse-proxy network so
# your proxy stack can reach it by container name, see the commented
# `proxy_net` lines below and PRD §12.5.
#
# Outbound hosts the backend may need to reach (all optional features —
# see PRD §12.6): api.github.com, raw.githubusercontent.com,
# api.search.brave.com, discord.com, your SMTP server.
#
# Data file ownership: set PUID/PGID (or define them in a .env file next to
# this compose file) to match the host user that should own /data. Defaults
# to 1000:1000. Find your IDs with `id -u` and `id -g`.

services:
  backend:
    image: ghcr.io/crzykidd/ammoledger-backend:latest
    volumes:
      - ammoledger_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      # --- Optional: data file ownership on NAS / multi-user hosts ---
      # Match the host user that should own /data. Find yours with `id -u` / `id -g`.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # --- Optional: run without a config.yaml by setting a session secret ---
      # Generate one with: openssl rand -hex 32
      # - AL_SESSION_SECRET=replace-with-a-32+-char-random-string
      #
      # --- Other optional overrides (all have safe defaults) ---
      # - AL_APP_NAME=AmmoLedger
      # - AL_BASE_URL=http://localhost:5173
      # - AL_BACKUP_ENABLED=true
      # - AL_BACKUP_SCHEDULE=03:00
      # - AL_BACKUP_RETENTION_DAYS=30
      # - AL_BACKUP_INCLUDE_PHOTOS=true
      # - AL_RESET_TOKEN=
      # - AL_IMAGE_SEARCH_ENABLED=false
      # - AL_IMAGE_SEARCH_PROVIDER=brave
      # - AL_IMAGE_SEARCH_API_KEY=
      #
      # The container defaults these to /data/... — only set if you relocate them:
      # - DATABASE_URL=sqlite:////data/ammoledger.db
      # - CONFIG_PATH=/data/config.yaml
      # - DEFAULTS_PATH=/data/defaults.yaml
      # - BACKUP_PATH=/data/backups
      # - UPLOADS_PATH=/data/uploads
    networks:
      - ammoledger_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: ghcr.io/crzykidd/ammoledger-frontend:latest
    ports:
      - "5173:5173"
    environment:
      - AL_BACKEND_URL=http://backend:8000
    networks:
      - ammoledger_net
      # Uncomment the next line to attach the frontend to an externally-
      # managed reverse-proxy network (see PRD §12.5):
      # - proxy_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ammoledger_data:
    driver: local

networks:
  ammoledger_net:
    driver: bridge
    # Intentionally NOT internal — the backend needs outbound for optional
    # features (Find Image, version check, community sync, notifications).
    # See PRD §12.6 for the full outbound host list.

  # Uncomment the block below if your reverse-proxy stack publishes a
  # shared network you want the frontend to attach to. Replace the `name:`
  # with whatever your proxy stack actually named the network.
  #
  # proxy_net:
  #   external: true
  #   name: proxy_net
