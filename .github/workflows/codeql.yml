name: CodeQL

# Static analysis / code scanning (SAST) required by the code-checkin-and-pr
# standard (v1.2.0). The gate is that the scan RUNS to completion — findings
# surface in the repository's Security → Code scanning view for triage and do
# not, by themselves, fail this check.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so the default branch stays analyzed even without pushes.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Python backend + the React/TS frontend.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          language: ${{ matrix.language }}

      # No autobuild step: both languages are interpreted, so CodeQL analyzes
      # the source directly without a compile step.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          category: "/language:${{ matrix.language }}"
